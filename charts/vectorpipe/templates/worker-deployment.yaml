apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "vectorpipe.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "vectorpipe.labels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "vectorpipe.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.worker.serviceAccountName }}
      securityContext:
        {{- include "vectorpipe.podSecurityContext" . | nindent 8 }}
      # SIGTERM lets the current job finish; Kubernetes SIGKILLs after this many seconds.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "vectorpipe.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            {{- include "vectorpipe.dbEnv" . | nindent 12 }}
            - name: WORKER_METRICS_PORT
              value: {{ .Values.worker.metricsPort | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort }}
          # The metrics server starts after the database and backend checks and before the job loop, so a
          # worker that can't reach Postgres exits instead of passing this probe.
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
