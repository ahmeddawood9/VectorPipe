apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "vectorpipe.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP   # reached via kubectl port-forward for now; an Ingress/ALB comes in session B
  selector:
    {{- include "vectorpipe.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
