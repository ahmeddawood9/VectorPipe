{{- if .Values.migration.enabled }}
# Runs ONCE per install/upgrade, before the API and worker pods start.
# Not an init container: two API replicas would both try to migrate.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "vectorpipe.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "vectorpipe.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        {{- include "vectorpipe.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "vectorpipe.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "vectorpipe.dbEnv" . | nindent 12 }}
{{- end }}
