# Where External Secrets reads from: AWS Secrets Manager.
# No auth block: the controller uses its own Pod Identity credentials.
# Check the apiVersion against the installed CRDs (v1 vs v1beta1).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
