# Copies the RDS-managed password into a normal Kubernetes Secret "db-credentials".
# Apply with the real ARN substituted (it changes whenever the database is recreated):
#   sed "s|REPLACE_DB_SECRET_ARN|$(terraform -chdir=terraform/data output -raw db_secret_arn)|g" \
#     k8s/bootstrap/30-externalsecret.yaml | kubectl apply -f -
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: vectorpipe
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
    template:
      data:
        DB_USER: "{{ .username }}"
        # URL-encoded so special characters can't break the connection URL
        DB_PASSWORD_ENCODED: "{{ .password | urlquery }}"
  data:
    - secretKey: username
      remoteRef:
        key: REPLACE_DB_SECRET_ARN
        property: username
    - secretKey: password
      remoteRef:
        key: REPLACE_DB_SECRET_ARN
        property: password
